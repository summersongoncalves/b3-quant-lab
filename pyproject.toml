[project]
name = "quantlab"
version = "0.1.0"
description = "Research lab for B3 day trade and swing trade strategies, driven by a strategist / implementer / validator agent loop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "MetaTrader5>=5.0.45",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
quantlab = "quantlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
